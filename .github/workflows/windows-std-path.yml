name: Windows path consistency test (nightly build-std)
# Identical on every branch by design: the ONLY difference between branches is
# library/std/src/path.rs (fix present vs absent). The branch's std path module
# is overlaid onto the nightly toolchain's rust-src tree, a scratch crate is
# created around the branch's std path test suite, and cargo -Zbuild-std
# compiles std FROM THAT SOURCE and runs the tests against it.
# Expected: fix branch green; test-only branch red at assert_ne!(drive, unc).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Same rationale as rust's ci.yml: identical step behavior on every host.
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-std-path-test:
    name: build-std path tests (windows-latest, branch std source)
    runs-on: windows-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly toolchain with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Overlay branch std path module onto nightly rust-src
        run: |
          SRC="$(rustc +nightly --print sysroot)/lib/rustlib/src/rust/library"
          test -f "$SRC/std/src/path.rs"
          cp library/std/src/path.rs "$SRC/std/src/path.rs"
          cmp library/std/src/path.rs "$SRC/std/src/path.rs"
          echo "overlay applied to: $SRC/std/src/path.rs"

      - name: Create scratch crate with the branch path test suite
        run: |
          cargo new scratch --lib
          mkdir -p scratch/tests
          cp library/std/tests/path.rs scratch/tests/path.rs
          grep -n "test_eq_ord_consistency_partially_consumed_prefix" scratch/tests/path.rs

      - name: Build std from branch source and run path tests (windows-msvc)
        working-directory: scratch
        run: cargo +nightly test -Zbuild-std --target x86_64-pc-windows-msvc --test path
