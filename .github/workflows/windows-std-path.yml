name: Windows path consistency test (nightly scratch crate, pre-fix std)
# Deliberately contains NO source fix: this branch only carries the regression
# test. The test is compiled into a throwaway crate and run against the
# INSTALLED nightly std of the runner, which still has the pre-fix
# Components::eq fast path. The job is expected to FAIL at
# assert_ne!(drive, unc) - that failure is the observation of the original
# bug on Windows. Requires nightly because the test file uses
# #![feature(...)] gates (clone_to_uninit, normalize_lexically,
# path_trailing_sep).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Same rationale as rust's ci.yml: identical step behavior on every host.
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scratch-nightly:
    name: cargo test path against installed nightly (windows-latest; expected FAIL pre-fix)
    runs-on: windows-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly toolchain (minimal profile)
        run: rustup toolchain install nightly --profile minimal

      - name: Create scratch crate with the std path test suite
        run: |
          cargo new scratch --lib
          mkdir -p scratch/tests
          cp library/std/tests/path.rs scratch/tests/path.rs
          grep -n "test_eq_ord_consistency_partially_consumed_prefix" scratch/tests/path.rs

      - name: Run path tests against installed pre-fix std
        working-directory: scratch
        run: cargo +nightly test --test path
